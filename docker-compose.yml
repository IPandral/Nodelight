services:
  nodelight:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-development}"
    container_name: nodelight
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      DASHBOARD_NAME: "${DASHBOARD_NAME:-Home Server}"
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:-admin}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
      TZ: "${TZ:-UTC}"
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      HOST_ROOT: /host/root
      HOST_VAR_LOG: /host/var/log
      DATA_DIR: /data
      SMART_ENABLED: "${SMART_ENABLED:-false}"
      SMARTCTL_PATH: "${SMARTCTL_PATH:-smartctl}"
      SMART_DEVICE_ROOT: "${SMART_DEVICE_ROOT:-/host/dev}"
      SERVICE_CHECKS: "${SERVICE_CHECKS:-}"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
      ALERT_WEBHOOK_TYPE: "${ALERT_WEBHOOK_TYPE:-generic}"
      ALERT_COOLDOWN_MINUTES: "${ALERT_COOLDOWN_MINUTES:-30}"
      GITHUB_REPOSITORY: "${GITHUB_REPOSITORY:-IPandral/Computer-usage-dashboard}"
      DEMO_MODE: "${DEMO_MODE:-false}"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/root:ro
      - /var/log:/host/var/log:ro
      - nodelight-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.50

volumes:
  nodelight-data:
