name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check web/app.js

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          NODELIGHT_IMAGE=ghcr.io/example/nodelight:latest docker compose -f docker-compose.release.yml config --quiet

      - name: Build container image
        run: docker build --tag nodelight-ci:${{ github.sha }} .
