name: Bug report
description: Tell us about something that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please remove passwords, IP addresses, and other private data before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the behavior you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the dashboard with...
        2. Open...
        3. See...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nodelight version
      placeholder: v1.0.0
  - type: dropdown
    id: architecture
    attributes:
      label: Server architecture
      options:
        - x86_64 / amd64
        - ARM64 / aarch64
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets and private network details before attaching anything.
