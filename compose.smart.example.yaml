# Optional SMART override. Copy this file to compose.smart.yaml, then edit the
# device list so it contains every whole disk you want Nodelight to inspect.
services:
  nodelight:
    user: "0:1000"
    group_add:
      - "${SMART_DISK_GID:-6}"
    environment:
      SMART_ENABLED: "true"
      SMARTCTL_PATH: smartctl
      # Keep canonical /dev paths so smartctl can auto-detect SATA and NVMe.
      SMART_DEVICE_ROOT: /dev
    cap_add:
      - SYS_RAWIO
      # Required by Linux for NVMe administrative commands such as self-tests.
      - SYS_ADMIN
      # Root still needs to write settings after the base file drops all caps.
      - DAC_OVERRIDE
    devices:
      - /dev/sda:/dev/sda:rwm
      - /dev/sdb:/dev/sdb:rwm
      # Add NVMe or further disks in the same form, for example:
      # - /dev/nvme0n1:/dev/nvme0n1:rwm
